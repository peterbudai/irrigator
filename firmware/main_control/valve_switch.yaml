sensor:
  - platform: template
    id: valve_sensor_${valve_number}
    update_interval: 1s
    lambda: |-
      return read_relay_register(id(relay_control), ${valve_number} - 1);

switch:
  - platform: template
    id: valve_switch_${valve_number}
    name: "Irrigation valve ${valve_number}"
    icon: "mdi:valve"
    disabled_by_default: true
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(valve_sensor_${valve_number}).state > 0.5;
    turn_on_action:
      - lambda: |-
          write_relay_register(id(relay_control), ${valve_number} - 1, 1);
    turn_off_action:
      - lambda: |-
          write_relay_register(id(relay_control), ${valve_number} - 1, 0);
