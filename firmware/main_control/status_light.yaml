select:
  - platform: template
    id: ${status_light_tag}_status_light
    name: ${status_light_name}
    disabled_by_default: true
    icon: "mdi:led-outline"
    options:
      - "Steady off"
      - "Blinking slow"
      - "Blinking fast"
      - "Steady on"
    update_interval: 1s
    lambda: |-
      auto state = read_i2c_register(id(user_control), ${status_register}, "status_light");
      if(!state.has_value()) {
        return {};
      }
      return id(${status_light_tag}_status_light).at(state.value());
    set_action:
      - lambda: |-
          auto value = id(${status_light_tag}_status_light).index_of(x);
          if(!value.has_value()) {
            ESP_LOGW("status_light", "Unknown light option: %s", x.c_str());
            return;
          }
          write_i2c_register(id(user_control), ${status_register}, value.value(), "status_light");
