sensor:
  - platform: template
    id: valve_sensor_${valve_number}
    update_interval: 1s
    lambda: |-
      auto state = read_i2c_register(id(relay_control), ${valve_number} - 1, "valve_sensor");
      if(!state.has_value()) {
        return NAN;
      }
      return state.value() != 0 ? 1.0 : 0.0;

switch:
  - platform: template
    id: valve_switch_${valve_number}
    name: "Irrigation valve ${valve_number}"
    icon: "mdi:valve"
    disabled_by_default: true
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(valve_sensor_${valve_number}).state > 0.5;
    turn_on_action:
      - lambda: |-
          write_i2c_register(id(relay_control), ${valve_number} - 1, 1, "valve_switch");
    turn_off_action:
      - lambda: |-
          write_i2c_register(id(relay_control), ${valve_number} - 1, 0, "valve_switch");
